{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeai.backend.fullname" . }}-config
  labels:
    {{- include "kubeai.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.backend.env.APP_NAME | quote }}
  APP_VERSION: {{ .Values.backend.env.APP_VERSION | quote }}
  DEBUG: {{ .Values.backend.env.DEBUG | quote }}
  API_PREFIX: {{ .Values.backend.env.API_PREFIX | quote }}
  DB_POOL_SIZE: {{ .Values.backend.env.DB_POOL_SIZE | quote }}
  DB_MAX_OVERFLOW: {{ .Values.backend.env.DB_MAX_OVERFLOW | quote }}
  REDIS_MAX_CONNECTIONS: {{ .Values.backend.env.REDIS_MAX_CONNECTIONS | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.backend.env.ACCESS_TOKEN_EXPIRE_MINUTES | quote }}
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.backend.env.REFRESH_TOKEN_EXPIRE_DAYS | quote }}
  IDLE_TIMEOUT_MINUTES: {{ .Values.backend.env.IDLE_TIMEOUT_MINUTES | quote }}
  ALLOW_USER_REGISTRATION: {{ .Values.backend.env.ALLOW_USER_REGISTRATION | quote }}
  OIDC_ENABLED: {{ .Values.backend.env.OIDC_ENABLED | quote }}
  MINIO_SECURE: {{ .Values.backend.env.MINIO_SECURE | quote }}
  MINIO_BUCKET_PREFIX: {{ .Values.backend.env.MINIO_BUCKET_PREFIX | quote }}
  DATASET_BASE_PATH: {{ .Values.backend.env.DATASET_BASE_PATH | quote }}
  HARBOR_PROJECT_PREFIX: {{ .Values.backend.env.HARBOR_PROJECT_PREFIX | quote }}
  FRONTEND_URL: {{ .Values.backend.env.FRONTEND_URL | quote }}
  K8S_PLATFORM_NAMESPACE: {{ .Release.Namespace | quote }}
  PROMETHEUS_URL: {{ include "kubeai.prometheusUrl" . | default "" | quote }}
  MLFLOW_ENABLED: {{ .Values.mlflow.enabled | quote }}
  MLFLOW_TRACKING_URI: {{ include "kubeai.mlflowTrackingUri" . | default "" | quote }}
  LABEL_STUDIO_URL: {{ include "kubeai.labelStudioUrl" . | default "" | quote }}
  JUPYTERHUB_API_URL: {{ include "kubeai.jupyterhubApiUrl" . | default "" | quote }}
  JUPYTERHUB_BASE_URL: {{ include "kubeai.jupyterhubBaseUrl" . | default "" | quote }}
  JUPYTERHUB_HUB_SERVICE_ACCOUNT: {{ include "kubeai.jupyterhubHubServiceAccount" . | default "" | quote }}
  DEV_ENV_OPEN_TICKET_EXPIRE_SECONDS: {{ .Values.backend.env.DEV_ENV_OPEN_TICKET_EXPIRE_SECONDS | default "60" | quote }}
{{- end }}

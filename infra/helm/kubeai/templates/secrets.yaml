{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeai.backend.fullname" . }}-secret
  labels:
    {{- include "kubeai.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.backend.secrets.SECRET_KEY | default (randAlphaNum 32) | quote }}
  DATABASE_URL: {{ include "kubeai.databaseUrl" . | quote }}
  REDIS_URL: {{ include "kubeai.redisUrl" . | quote }}
  MINIO_ENDPOINT: {{ include "kubeai.minioEndpoint" . | quote }}
  MINIO_ACCESS_KEY: {{ .Values.backend.secrets.MINIO_ACCESS_KEY | default .Values.minio.auth.rootUser | quote }}
  MINIO_SECRET_KEY: {{ .Values.backend.secrets.MINIO_SECRET_KEY | default .Values.minio.auth.rootPassword | quote }}
  {{- if .Values.harbor.enabled }}
  HARBOR_URL: {{ .Values.backend.secrets.HARBOR_URL | default (printf "http://%s-harbor-core.%s.svc.cluster.local:80" (include "kubeai.fullname" .) .Release.Namespace) | quote }}
  HARBOR_USERNAME: {{ .Values.backend.secrets.HARBOR_USERNAME | default "admin" | quote }}
  HARBOR_PASSWORD: {{ .Values.backend.secrets.HARBOR_PASSWORD | default .Values.harbor.harborAdminPassword | quote }}
  {{- else }}
  HARBOR_URL: {{ .Values.backend.secrets.HARBOR_URL | default "http://harbor.kubeai.local" | quote }}
  HARBOR_USERNAME: {{ .Values.backend.secrets.HARBOR_USERNAME | default "admin" | quote }}
  HARBOR_PASSWORD: {{ .Values.backend.secrets.HARBOR_PASSWORD | default "" | quote }}
  {{- end }}
{{- end }}

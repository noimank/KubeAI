{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeai.fullname" . }}-minio
  labels:
    {{- include "kubeai.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "kubeai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.auth.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.auth.rootPassword | quote }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          {{- if .Values.minio.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
      {{- if .Values.minio.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubeai.fullname" . }}-minio
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeai.fullname" . }}-minio
  labels:
    {{- include "kubeai.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: {{ .Values.minio.service.type }}
  ports:
    - name: api
      port: 9000
      targetPort: api
      {{- if and (eq .Values.minio.service.type "NodePort") .Values.minio.service.nodePorts.api }}
      nodePort: {{ .Values.minio.service.nodePorts.api }}
      {{- end }}
    - name: console
      port: 9001
      targetPort: console
      {{- if and (eq .Values.minio.service.type "NodePort") .Values.minio.service.nodePorts.console }}
      nodePort: {{ .Values.minio.service.nodePorts.console }}
      {{- end }}
  selector:
    {{- include "kubeai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
{{- if .Values.minio.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeai.fullname" . }}-minio
  labels:
    {{- include "kubeai.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
{{- end }}
{{- end }}

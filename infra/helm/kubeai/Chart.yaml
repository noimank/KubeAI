apiVersion: v2
name: kubeai
description: KubeAI - Kubernetes-native AI/ML Platform
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - ai
  - ml
  - kubernetes
  - training
maintainers:
  - name: noimank
    email: noimank@163.com

dependencies:
  - name: postgresql
    version: "16.7.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    alias: postgresql

  - name: volcano
    version: "1.14.x"
    repository: https://volcano-sh.github.io/helm-charts
    condition: volcano.enabled
    alias: volcano

  - name: harbor
    version: "1.16.0"
    repository: https://helm.goharbor.io
    condition: harbor.enabled
    alias: harbor

  - name: kube-prometheus-stack
    version: "67.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
    alias: prometheus

  - name: dcgm-exporter
    version: "3.x"
    repository: https://nvidia.github.io/dcgm-exporter/helm-charts
    condition: dcgmExporter.enabled
    alias: dcgmExporter

  # Post-MVP dependencies (install separately):
  # KServe: deploy via infra/scripts/install-kserve.sh (uses OCI Helm charts)
  #   helm install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd --version v0.17.0 -n kserve --create-namespace
  #   helm install kserve oci://ghcr.io/kserve/charts/kserve-resources --version v0.17.0 -n kserve --set kserve.controller.deploymentMode=Standard

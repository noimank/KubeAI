apiVersion: v2
name: kubeai
description: KubeAI local development infrastructure dependencies
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - ai
  - ml
  - kubernetes
  - training
maintainers:
  - name: noimank
    email: noimank@163.com

dependencies:
  - name: cert-manager
    version: "v1.16.x"
    repository: https://charts.jetstack.io
    condition: certmanager.enabled
    alias: certmanager

  - name: postgresql
    version: "16.7.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    alias: postgresql

  - name: volcano
    version: "1.14.x"
    repository: https://volcano-sh.github.io/helm-charts
    condition: volcano.enabled
    alias: volcano

  - name: harbor
    version: "1.16.0"
    repository: https://helm.goharbor.io
    condition: harbor.enabled
    alias: harbor

  - name: kube-prometheus-stack
    version: "67.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
    alias: prometheus

  - name: dcgm-exporter
    version: "3.x"
    repository: https://nvidia.github.io/dcgm-exporter/helm-charts
    condition: dcgmexporter.enabled
    alias: dcgmexporter

  - name: keda
    version: "2.16.x"
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
    alias: keda

  # APISIX API gateway (company standard) — handles path-based routing for
  # dev environments via ApisixRoute CRD.  Includes etcd + ingress-controller.
  - name: apisix
    version: "2.14.x"
    repository: https://charts.apiseven.com
    condition: apisix.enabled
    alias: apisix

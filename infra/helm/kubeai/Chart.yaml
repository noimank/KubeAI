apiVersion: v2
name: kubeai
description: KubeAI local development infrastructure dependencies
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - ai
  - ml
  - kubernetes
  - training
maintainers:
  - name: noimank
    email: noimank@163.com

dependencies:
  - name: cert-manager
    version: "v1.16.x"
    repository: https://charts.jetstack.io
    condition: certManager.enabled
    alias: certManager

  - name: postgresql
    version: "16.7.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    alias: postgresql

  - name: volcano
    version: "1.14.x"
    repository: https://volcano-sh.github.io/helm-charts
    condition: volcano.enabled
    alias: volcano

  - name: harbor
    version: "1.16.0"
    repository: https://helm.goharbor.io
    condition: harbor.enabled
    alias: harbor

  - name: kube-prometheus-stack
    version: "67.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
    alias: prometheus

  - name: dcgm-exporter
    version: "3.x"
    repository: https://nvidia.github.io/dcgm-exporter/helm-charts
    condition: dcgmExporter.enabled
    alias: dcgmExporter

  - name: kserve-crd
    version: "v0.17.0"
    repository: oci://ghcr.io/kserve/charts
    condition: kserveCrd.enabled
    alias: kserveCrd

  - name: kserve-resources
    version: "v0.17.0"
    repository: oci://ghcr.io/kserve/charts
    condition: kserveResources.enabled
    alias: kserveResources

  - name: keda
    version: "2.16.x"
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
    alias: keda

  # Label Studio: deployed as custom template (templates/labelstudio.yaml)

  - name: jupyterhub
    version: "4.3.x"
    repository: https://jupyterhub.github.io/helm-chart/
    condition: jupyterhub.enabled

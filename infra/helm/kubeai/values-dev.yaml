# -- Dev environment: infrastructure services only, run backend/frontend locally

backend:
  enabled: false

frontend:
  enabled: false

# Override Bitnami images with official images (Bitnami free images deprecated since Aug 2025)
postgresql:
  image:
    registry: docker.io
    repository: postgres
    tag: "17-alpine"
  auth:
    postgresPassword: "postgres"
  primary:
    persistence:
      size: 5Gi
    service:
      type: NodePort
      nodePorts:
        postgresql: 30432
    extraEnvVars:
      - name: POSTGRES_DB
        value: "kubeai"
      - name: PGDATA
        value: /bitnami/postgresql/data
    extraVolumes:
      - name: run
        emptyDir: {}
    extraVolumeMounts:
      - name: run
        mountPath: /var/run/postgresql

redis:
  service:
    type: NodePort
    nodePort: 30379

minio:
  auth:
    rootUser: "minioadmin"
    rootPassword: "minioadmin"
  service:
    type: NodePort
    nodePorts:
      api: 30900
      console: 30901
  persistence:
    size: 10Gi

harbor:
  enabled: false

volcano:
  custom:
    scheduler:
      replicas: 1

prometheus:
  enabled: true
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      retention: 7d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
    service:
      type: NodePort
      nodePort: 30090
  grafana:
    enabled: true
    service:
      type: NodePort
      nodePort: 30030
  alertmanager:
    enabled: false
  nodeExporter:
    enabled: false  # Docker Desktop does not support shared root mount

dcgmExporter:
  enabled: false  # Dev: no GPU nodes typically

mlflow:
  enabled: true
  service:
    type: NodePort
    nodePort: 30500
  persistence:
    size: 5Gi

ingress:
  enabled: false

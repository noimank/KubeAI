# -- Global settings
global:
  namespace: kubeai
  imageRegistry: ""
  imagePullSecrets: []

# -- cert-manager (required by KServe webhooks)
certManager:
  enabled: false
  crds:
    enabled: true

# -- PostgreSQL sub-chart
postgresql:
  enabled: true
  auth:
    postgresPassword: "kubeai-postgres"
    database: kubeai
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    initdb:
      scripts:
        01-create-mlflow-db.sql: |
          CREATE DATABASE mlflow;
        02-create-labelstudio-db.sql: |
          CREATE DATABASE labelstudio;

# -- Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  service:
    type: ClusterIP
    nodePort: null
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# -- MinIO
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: "latest"
  auth:
    rootUser: minioadmin
    rootPassword: "kubeai-minio"
  service:
    type: ClusterIP
    nodePorts:
      api: null
      console: null
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

# -- Volcano scheduler (required for training jobs)
volcano:
  enabled: true
  custom:
    enableQueue: true
    scheduler:
      replicas: 1

# -- Harbor registry (disabled by default - resource intensive)
harbor:
  enabled: false
  expose:
    type: ingress
    ingress:
      hosts:
        core: harbor.kubeai.local
  internalTLS:
    enabled: false
  persistence:
    persistentVolumeClaim:
      registry:
        size: 50Gi
  harborAdminPassword: "Harbor12345"

# -- kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
# Provides the metrics collection backend for DCGM Exporter GPU metrics.
# Grafana accessible at /grafana via ingress or port-forward.
prometheus:
  enabled: true
  prometheus:
    prometheusSpec:
      # Allow ServiceMonitor discovery across all namespaces (required for DCGM Exporter)
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
  grafana:
    enabled: true
    defaultDashboardsEnabled: true
  alertmanager:
    enabled: true

# -- NVIDIA DCGM Exporter (GPU metrics via Prometheus)
# Exposes GPU utilization, memory, temperature, power as Prometheus metrics.
# Requires NVIDIA device plugin on GPU nodes.
# Key: kubernetes.enablePodLabels=true adds namespace/pod/container labels to metrics.
dcgmExporter:
  enabled: false
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    honorLabels: true
  kubernetes:
    enablePodLabels: true
    enablePodUID: false
    rbac:
      create: true
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# -- KServe (model serving inference)
# Infrastructure dependency only. Backend/frontend/Taskiq are not deployed by this chart.
kserveCrd:
  enabled: false

kserveResources:
  enabled: false
  kserve:
    controller:
      deploymentMode: Standard

# -- KEDA (event-driven autoscaling for inference services)
keda:
  enabled: false

# -- MLflow Tracking Server (experiment tracking)
# Deploys MLflow with PostgreSQL backend store and PVC artifact storage.
mlflow:
  enabled: false
  image:
    repository: ghcr.io/mlflow/mlflow
    tag: "v3.12.0"
  service:
    type: ClusterIP
    nodePort: null
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# -- Label Studio (data annotation service)
# Deploys Label Studio with PostgreSQL backend store.
labelstudio:
  enabled: false
  image:
    repository: heartexlabs/label-studio
    tag: "1.23.0"
  auth:
    token: ""
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- JupyterHub (notebook-based development environments)
# When enabled, provides JupyterHub for interactive dev environments.
# Backend manages notebooks via JupyterHub REST API with admin service token.
# Token is auto-generated by the chart and stored in <release>-jupyterhub-hub-secret.
jupyterhub:
  enabled: false

  hub:
    services:
      kubeai:
        name: "kubeai"
    loadRoles:
      kubeai:
        services:
          - kubeai
        scopes:
          - admin:users
          - admin:servers
          - users
          - read:roles
          - read:groups
    config:
      JupyterHub:
        authenticator_class: "null"
      Spawner:
        http_timeout: 300
    extraConfig:
      10-kubeai-user-options: |
        import json
        import os

        from jupyterhub.auth import Authenticator
        from tornado.httpclient import AsyncHTTPClient, HTTPError, HTTPRequest

        _kubeai_hub_namespace = os.environ.get("POD_NAMESPACE", "kubeai")
        c.JupyterHub.hub_connect_url = f"http://hub.{_kubeai_hub_namespace}.svc.cluster.local:8081/hub/"
        _kubeai_login_url = os.environ.get(
            "KUBEAI_JUPYTERHUB_LOGIN_URL",
            "http://host.docker.internal:8000/api/dev-environments/jupyterhub-login",
        )

        class KubeAIForcedLoginAuthenticator(Authenticator):
            auto_login = True
            login_service = "KubeAI"

            async def authenticate(self, handler, data=None):
                login_token = handler.get_argument("login_token", "")
                if not login_token:
                    return None

                request = HTTPRequest(
                    _kubeai_login_url,
                    method="POST",
                    headers={"Content-Type": "application/json"},
                    body=json.dumps({"token": login_token}),
                    request_timeout=10,
                )
                try:
                    response = await AsyncHTTPClient().fetch(request)
                    payload = json.loads(response.body.decode("utf-8"))
                except (HTTPError, json.JSONDecodeError) as exc:
                    self.log.warning("KubeAI forced login failed: %s", exc)
                    return None

                name = payload.get("name")
                if isinstance(name, str) and name:
                    return {"name": name}
                return None

        c.JupyterHub.authenticator_class = KubeAIForcedLoginAuthenticator
        c.Authenticator.allow_all = True

        def _kubeai_cpu_value(value):
            if isinstance(value, (int, float)):
                return float(value)
            if isinstance(value, str):
                value = value.strip()
                if value.endswith("m"):
                    return float(value[:-1]) / 1000
                return float(value)
            return None

        def _kubeai_memory_value(value):
            if isinstance(value, int):
                return value
            if isinstance(value, str):
                value = value.strip()
                for suffix in ("Ki", "Mi", "Gi", "Ti"):
                    if value.endswith(suffix):
                        return value[:-1]
                return value
            return None

        def _kubeai_apply_user_options(spawner, user_options):
            override = user_options.get("kubespawner_override") if isinstance(user_options, dict) else None
            if not isinstance(override, dict):
                return

            namespace = override.get("namespace")
            if isinstance(namespace, str) and namespace.startswith("kubeai-"):
                spawner.namespace = namespace

            image = override.get("image")
            if isinstance(image, str) and image:
                spawner.image = image

            image_pull_secret = override.get("imagePullSecret")
            if isinstance(image_pull_secret, str) and image_pull_secret:
                spawner.image_pull_secrets = [{"name": image_pull_secret}]

            cmd = override.get("cmd")
            if isinstance(cmd, str) and cmd:
                spawner.cmd = cmd
            elif isinstance(cmd, list) and all(isinstance(item, str) for item in cmd):
                spawner.cmd = cmd

            args = override.get("args")
            if isinstance(args, str) and args:
                spawner.args = [args]
            elif isinstance(args, list) and all(isinstance(item, str) for item in args):
                spawner.args = args

            port = override.get("port")
            if isinstance(port, int) and port > 0:
                spawner.port = port

            default_url = override.get("defaultUrl")
            if isinstance(default_url, str) and default_url:
                spawner.default_url = default_url

            working_dir = override.get("workingDir")
            if isinstance(working_dir, str) and working_dir:
                spawner.working_dir = working_dir

            resources = override.get("resources")
            if isinstance(resources, dict):
                requests = resources.get("requests")
                limits = resources.get("limits")
                if isinstance(requests, dict):
                    if requests.get("cpu"):
                        spawner.cpu_guarantee = _kubeai_cpu_value(requests["cpu"])
                    if requests.get("memory"):
                        spawner.mem_guarantee = _kubeai_memory_value(requests["memory"])
                    spawner.extra_resource_guarantees = {
                        k: v for k, v in requests.items() if k not in {"cpu", "memory"}
                    }
                if isinstance(limits, dict):
                    if limits.get("cpu"):
                        spawner.cpu_limit = _kubeai_cpu_value(limits["cpu"])
                    if limits.get("memory"):
                        spawner.mem_limit = _kubeai_memory_value(limits["memory"])
                    spawner.extra_resource_limits = {
                        k: v for k, v in limits.items() if k not in {"cpu", "memory"}
                    }

            volumes = override.get("volumes")
            if isinstance(volumes, list):
                spawner.volumes = volumes

            volume_mounts = override.get("volumeMounts")
            if isinstance(volume_mounts, list):
                spawner.volume_mounts = volume_mounts

            env = override.get("env")
            if isinstance(env, list):
                environment = dict(spawner.environment or {})
                for item in env:
                    if isinstance(item, dict) and isinstance(item.get("name"), str):
                        environment[item["name"]] = item.get("value", "")
                spawner.environment = environment

            init_containers = override.get("initContainers")
            if isinstance(init_containers, list):
                spawner.init_containers = init_containers

        c.Spawner.apply_user_options = _kubeai_apply_user_options
    networkPolicy:
      interNamespaceAccessLabels: accept
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubeai.io/tenant-namespace: "true"
          ports:
            - port: 8888
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  proxy:
    service:
      type: LoadBalancer
    chp:
      networkPolicy:
        interNamespaceAccessLabels: accept
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubeai.io/tenant-namespace: "true"
            ports:
              - port: 8888
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

  singleuser:
    image:
      name: jupyter/datascience-notebook
      tag: "latest"
    networkTools:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
    storage:
      type: none
    profileList: []
    defaultUrl: "/lab"
    cpu:
      limit: 2
      guarantee: 0.5
    memory:
      limit: 4G
      guarantee: 1G

  ingress:
    enabled: false

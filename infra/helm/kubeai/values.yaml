# -- Global settings
global:
  namespace: kubeai
  imageRegistry: ""
  imagePullSecrets: []

# -- Backend configuration
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: kubeai-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  migration:
    enabled: true
  env:
    APP_NAME: KubeAI
    APP_VERSION: "0.1.0"
    DEBUG: "false"
    API_PREFIX: /api
    DB_POOL_SIZE: "20"
    DB_MAX_OVERFLOW: "10"
    REDIS_MAX_CONNECTIONS: "20"
    ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    REFRESH_TOKEN_EXPIRE_DAYS: "7"
    IDLE_TIMEOUT_MINUTES: "30"
    ALLOW_USER_REGISTRATION: "true"
    OIDC_ENABLED: "false"
    MINIO_SECURE: "false"
    MINIO_BUCKET_PREFIX: "kubeai-datasets-"
    HARBOR_PROJECT_PREFIX: "kubeai-"
    FRONTEND_URL: "http://localhost:30000"
    PROMETHEUS_URL: "http://kubeai-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  secrets:
    SECRET_KEY: ""
    DATABASE_URL: ""
    REDIS_URL: ""
    MINIO_ENDPOINT: ""
    MINIO_ACCESS_KEY: ""
    MINIO_SECRET_KEY: ""
    HARBOR_URL: ""
    HARBOR_USERNAME: ""
    HARBOR_PASSWORD: ""
    LABEL_STUDIO_API_TOKEN: ""
    JUPYTERHUB_API_TOKEN: ""

# -- Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: kubeai-frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubeai.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- PostgreSQL sub-chart
postgresql:
  enabled: true
  auth:
    postgresPassword: "kubeai-postgres"
    database: kubeai
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    initdb:
      scripts:
        01-create-mlflow-db.sql: |
          CREATE DATABASE mlflow;
        02-create-labelstudio-db.sql: |
          CREATE DATABASE labelstudio;

# -- Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  service:
    type: ClusterIP
    nodePort: null
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# -- MinIO
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: "latest"
  auth:
    rootUser: minioadmin
    rootPassword: "kubeai-minio"
  service:
    type: ClusterIP
    nodePorts:
      api: null
      console: null
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

# -- Volcano scheduler (required for training jobs)
volcano:
  enabled: true
  custom:
    enableQueue: true
    scheduler:
      replicas: 1

# -- Harbor registry (disabled by default - resource intensive)
harbor:
  enabled: false
  expose:
    type: ingress
    ingress:
      hosts:
        core: harbor.kubeai.local
  internalTLS:
    enabled: false
  persistence:
    persistentVolumeClaim:
      registry:
        size: 50Gi
  harborAdminPassword: "Harbor12345"

# -- kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
# Provides the metrics collection backend for DCGM Exporter GPU metrics.
# Grafana accessible at /grafana via ingress or port-forward.
prometheus:
  enabled: true
  prometheus:
    prometheusSpec:
      # Allow ServiceMonitor discovery across all namespaces (required for DCGM Exporter)
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
  grafana:
    enabled: true
    defaultDashboardsEnabled: true
  alertmanager:
    enabled: true

# -- NVIDIA DCGM Exporter (GPU metrics via Prometheus)
# Exposes GPU utilization, memory, temperature, power as Prometheus metrics.
# Requires NVIDIA device plugin on GPU nodes.
# Key: kubernetes.enablePodLabels=true adds namespace/pod/container labels to metrics.
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    honorLabels: true
  kubernetes:
    enablePodLabels: true
    enablePodUID: false
    rbac:
      create: true
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# -- KServe (model serving inference)
# Deploy KServe separately: infra/scripts/install-kserve.sh
# Required for inference service management (InferenceService CRD).
kserve:
  enabled: false
  namespace: kserve
  version: "v0.17.0"
  # Standard = RawDeployment (no Knative required)
  # Knative = Serverless (requires Knative Serving)
  deploymentMode: Standard

# -- MLflow Tracking Server (experiment tracking)
# Deploys MLflow with PostgreSQL backend store and PVC artifact storage.
# When enabled, MLFLOW_TRACKING_URI is auto-injected into backend pods.
mlflow:
  enabled: false
  image:
    repository: ghcr.io/mlflow/mlflow
    tag: "v3.12.0"
  service:
    type: ClusterIP
    nodePort: null
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# -- Label Studio (data annotation service)
# Deploys Label Studio with PostgreSQL backend store.
# When enabled, LABEL_STUDIO_URL is auto-injected into backend pods.
labelstudio:
  enabled: false
  image:
    repository: heartexlabs/label-studio
    tag: "1.23.0"
  auth:
    token: ""
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- JupyterHub (notebook-based development environments)
# When enabled, provides JupyterHub for interactive dev environments.
# Backend manages notebooks via JupyterHub REST API with admin service token.
# Token is auto-generated by the chart and stored in <release>-jupyterhub-hub-secret.
jupyterhub:
  enabled: false

  hub:
    services:
      kubeai:
        name: "kubeai"
    loadRoles:
      kubeai:
        services:
          - kubeai
        scopes:
          - admin:users
          - admin:servers
          - users
          - read:roles
          - read:groups
    config:
      JupyterHub:
        authenticator_class: "null"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  proxy:
    service:
      type: LoadBalancer
    chp:
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

  singleuser:
    image:
      name: jupyter/datascience-notebook
      tag: "latest"
    storage:
      type: none
    profileList: []
    defaultUrl: "/lab"
    cpu:
      limit: 2
      guarantee: 0.5
    memory:
      limit: 4G
      guarantee: 1G

  ingress:
    enabled: false

# ApisixRoute - KubeAI 前端流量入口
# 依赖: 集群中已有的 APISIX 网关 (公司统一基础设施)
# 部署: kubectl apply -f infra/k8s/ingress/
#
# 注意: 不需要单独部署 ingress controller — APISIX 是公司统一网关，
# 此 ApisixRoute 资源会被自动拾取并路由。
#
# ============================================================
# 部署前 Checklist
# ============================================================
#
# [ ] 1. 修改域名: 全文替换 kubeai.example.com → 实际生产域名
# [ ] 2. SSL 证书: 在 APISIX Admin API 或 Dashboard 中为域名配置 SSL 证书
#          - 参考命令: curl -X PUT http://apisix-admin:9180/apisix/admin/ssls/<ssl_id> \
#                       -H 'X-API-KEY: <key>' -d '{"cert":"...","key":"...","snis":["<domain>"]}'
# [ ] 3. 子路径: 如果 API / MLflow 有子路径变更，同步修改
#          - backend-api 路由将 /api/* 直接转发到 backend，不经过前端 Nginx
#          - 避免 Nginx client_max_body_size 等默认限制影响后端接口
# [ ] 4. 开发环境: devenv 路由由 Backend 通过 APISIX Admin API 动态创建/销毁
#          - 依赖 APISIX Admin API 可达且 API Key 正确配置
#          - 无需在此文件中手动管理
# [✓] 5. MLflow UI 鉴权: MLflow 自身无租户隔离, 已通过 forward-auth 插件鉴权
#          - 端点: backend /api/auth/check?resource=experiments&action=read
#          - 配置方式: APISIX Admin API PUT /apisix/admin/routes/<mlflow_route_id>
#          - 插件参数: request_headers=["Cookie"], upstream_headers=["X-KubeAI-User"]
#
# ============================================================
# 路由优先级说明
# ============================================================
# APISIX 按优先级 (priority, 越高越优先) + 匹配精确度排序:
#   - /devenv/<uuid>/*           → priority 100 (动态创建，高于通配)
#   - /api/*                     → priority 100 (子路径路由，高于通配)
#   - /*                         → priority 0   (兜底路由，匹配静态资源)
# ============================================================
# 生产环境参考配置 (aiaxis.uimpcloud.com)
# ============================================================
# 以下配置基于 kubeai-prod-env (192.168.18.171) 上的 APISIX 运行配置:
#   - API 路由: host=aiaxis.uimpcloud.com, uri=/api/*, priority=100,
#     upstream=backend.kubeai:8000, websocket=true
#   - MLflow: host=aiaxis.uimpcloud.com, uris=["/mlflow","/mlflow/*"],
#     priority=100, proxy-rewrite regex ["^/mlflow/?(.*)$","/$1"],
#     forward-auth → /api/auth/check?resource=experiments&action=read,
#     upstream=mlflow.kubeai:5000
#   - 主路由: host=aiaxis.uimpcloud.com, uri=/*, upstream=frontend.kubeai:80
#   - SSL: Let's Encrypt 自动续期证书，snis=["aiaxis.uimpcloud.com"]
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: kubeai-frontend
  namespace: kubeai
  labels:
    app.kubernetes.io/name: kubeai
    app.kubernetes.io/component: ingress
spec:
  http:
    # ============================================================
    # 路由 1: 后端 API 服务 (子路径 /api/)
    # 优先级 100，高于 /* 兜底路由
    # /api/* 直接转发到 backend，不经过前端 Nginx
    # 避免 Nginx client_max_body_size 等默认限制影响文件上传等接口
    # WebSocket 启用: 支持 /api/ws 实时通知长连接
    # ============================================================
    - name: backend-api
      priority: 100
      match:
        hosts:
          - kubeai.example.com # FIXME: 改为实际生产域名
        paths:
          - /api/*
      backends:
        - serviceName: backend
          servicePort: 8000
      websocket: true

    # ============================================================
    # 路由 2: MLflow 实验追踪 UI (子路径 /mlflow)
    # 优先级必须高于 /* 通配路由, 否则通配路由会抢先匹配
    # proxy-rewrite 将 /mlflow$PATH 重写为 /$PATH 再转发
    # 部署前必须: 在 APISIX 上配置 forward-auth 鉴权 (见顶部 checklist #5)
    # ============================================================
    - name: mlflow
      priority: 100
      match:
        hosts:
          - kubeai.example.com # FIXME: 改为实际生产域名
        paths:
          - /mlflow
          - /mlflow/*
      backends:
        - serviceName: mlflow
          servicePort: 5000
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - ^/mlflow/?(.*)$
              - /$1

    # ============================================================
    # 路由 4: 平台主入口 (兜底路由 /*)
    # 仅匹配静态资源请求，API 和子路径请求已被以上高优先级路由拦截
    # ============================================================
    - name: frontend
      match:
        hosts:
          - kubeai.example.com # FIXME: 改为实际生产域名
        paths:
          - /*
      backends:
        - serviceName: frontend
          servicePort: 80
      websocket: true

# Taskiq Worker Deployment - 后台异步任务执行器
# 与 FastAPI 后端独立部署，后端水平扩缩容不会影响 worker 副本数。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-taskiq-worker
  namespace: kubeai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: taskiq-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/component: taskiq-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: taskiq-worker
    spec:
      serviceAccountName: backend
      nodeSelector:
        kubeai: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: taskiq-worker
          image: kubeai-backend:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["taskiq", "worker", "app.core.taskiq_app:broker", "--fs-discover"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: data-volume
              mountPath: /data/kubeai
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data-volume
          hostPath:
            path: /data/kubeai
            type: DirectoryOrCreate

# Backend Service
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubeai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api

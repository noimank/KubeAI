# Backend Deployment - FastAPI 后端服务
# 部署前需先创建 ConfigMap、Secret、RBAC
#
# 数据持久化: /data/kubeai 用于存放数据集、算法文件、用户上传数据等。
# 生产环境建议替换为 PVC 或 NFS 等共享存储，避免节点故障导致数据丢失。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubeai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: backend
      nodeSelector:
        kubeai: "true"
      # hostPath 模式:/data/kubeai 在宿主机上归属 root,容器进程(UID 999)无法写入。
      # fsGroup 让 kubelet 在挂载时把卷根 chown 到 999,子目录继承即可写。
      # 新建子目录(datasets/ 等)由 Python 端 Path.mkdir(parents=True) 创建,默认 umask 0022
      # 即可被 UID 999 所属的 GID 999 写(因 fsGroup 加入了 999 组)。
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: migrate
          image: kubeai-backend:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: data-volume
              mountPath: /data/kubeai
      containers:
        - name: backend
          image: kubeai-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: data-volume
              mountPath: /data/kubeai
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data-volume
          hostPath:
            path: /data/kubeai
            type: DirectoryOrCreate

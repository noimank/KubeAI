# KubeAI 后端配置 - ConfigMap + Secret
# 部署: kubectl apply -f infra/k8s/backend-config.yaml
#
# 生产部署前必须修改:
#   Secret:
#     - SECRET_KEY: openssl rand -hex 32 生成随机密钥
#     - DATABASE_URL: 密码与 PostgreSQL 实际密码一致
#     - MINIO_ACCESS_KEY / MINIO_SECRET_KEY: 与 MinIO 凭证一致
#     - HARBOR_PASSWORD: 与 Harbor 实际密码一致
#   ConfigMap:
#     - FRONTEND_URL: 改为实际生产域名
#     - PROMETHEUS_URL: 确认与集群中 Prometheus Service 名称一致
#
# 本文件与 backend/app/core/config.py 中的 Settings 字段对齐
# 未列出的字段使用 config.py 中的默认值
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: kubeai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
data:
  # -- 应用基本配置
  APP_NAME: "KubeAI"
  APP_VERSION: "0.1.0"
  DEBUG: "false"
  API_PREFIX: "/api"

  # -- 数据库连接池
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"

  # -- Redis 连接池
  REDIS_MAX_CONNECTIONS: "20"
  TASKIQ_BROKER_DB: "1"
  TASKIQ_RESULT_BACKEND_DB: "2"
  TASK_MAX_RETRIES: "3"
  TASK_RETRY_BACKOFF_SECONDS: "10"

  # -- Token 过期时间
  ACCESS_TOKEN_EXPIRE_MINUTES: "180"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # -- 账户锁定 (登录失败后锁定时长)
  IDLE_TIMEOUT_MINUTES: "30"

  # -- 开发环境空闲检测
  DEV_ENV_IDLE_TIMEOUT_MINUTES: "60"
  DEV_ENV_IDLE_CHECK_INTERVAL_SECONDS: "300"

  # -- 服务状态同步间隔 (推理/训练 Job 状态轮询)
  INFERENCE_SERVICE_STATUS_SYNC_INTERVAL_SECONDS: "60"
  TRAINING_JOB_STATUS_SYNC_INTERVAL_SECONDS: "60"

  # -- 身份/租户缓存 TTL (秒)
  IDENTITY_CACHE_TTL_SECONDS: "300"
  TENANT_STATUS_CACHE_TTL_SECONDS: "120"

  # -- 资源清理 (已完成训练任务的 Pod 清理)
  RESOURCE_CLEANUP_ENABLED: "true"
  RESOURCE_CLEANUP_INTERVAL_SECONDS: "3600"
  RESOURCE_CLEANUP_JOB_MAX_AGE_DAYS: "7"

  # -- 用户注册
  ALLOW_USER_REGISTRATION: "true"

  # -- OIDC/SSO (启用后需配置 OIDC_ISSUER / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET)
  # 对接 Casdoor 时：需要在 Casdoor 应用中创建 kubeai_ 前缀的角色
  # 角色映射: kubeai_admin→admin, kubeai_mlops→mlops, kubeai_engineer→engineer, kubeai_annotator→annotator
  OIDC_ENABLED: "false"
  OIDC_SCOPES: "openid profile email"
  OIDC_DISPLAY_NAME: "SSO 登录"
  OIDC_AUTO_REDIRECT: "false"

  # -- 前端地址（OIDC 回调/邮件链接等使用，部署时必须改为实际域名）
  FRONTEND_URL: "https://kubeai.example.com"  # FIXME: 改为实际生产域名

  # -- MinIO (保留兼容; 模型存储已改本地 MODEL_BASE_PATH, 此处不再被模型链路使用)
  MINIO_SECURE: "false"
  MINIO_BUCKET_PREFIX: "kubeai-models-"
  # 集群内 Pod 访问 MinIO 的地址, 带 scheme (initContainer / model-pull 等使用)
  # Helm 拓扑: http://kubeai-minio.kubeai.svc.cluster.local:9000
  MINIO_INTERNAL_ENDPOINT: "http://minio.kubeai.svc.cluster.local:9000"
  DATASET_BASE_PATH: "/data/kubeai/datasets"
  # -- 模型文件本地存储路径 (backend/worker 同节点共享 hostPath /data/kubeai)
  MODEL_BASE_PATH: "/data/kubeai/models"

  # -- Harbor (非敏感配置)
  HARBOR_PROJECT_PREFIX: "kubeai-"

  # -- K8s 命名空间
  K8S_PLATFORM_NAMESPACE: "kubeai"

  # -- 内部服务地址 (按实际部署修改；下文为独立 k8s YAML 部署的默认地址)
  PROMETHEUS_URL: "http://keda-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"

  # -- MLflow 实验追踪 (必选基础依赖; 训练任务可选择是否启用, 通过创建任务表单的 "实验追踪" 开关)
  MLFLOW_TRACKING_URI: "http://mlflow.kubeai.svc.cluster.local:5000"

  # -- Label Studio 数据标注 (部署 labelstudio/ 后启用)
  LABEL_STUDIO_URL: "http://labelstudio.kubeai.svc.cluster.local:8080"

  # -- 算法文件本地存储路径
  ALGORITHM_BASE_PATH: "/data/kubeai/algorithms"

  # -- 开发环境 Native Pod 管理 — APISIX Admin API 动态路由
  # 路由 /devenv/<uuid_hex>/ 与主应用共用域名

  # APISIX Admin API 地址 (backend 创建/删除环境时调用)
  KUBEAI_APISIX_ADMIN_URL: "http://kubeai-apisix-admin.kubeai.svc.cluster.local:9180"

  # APISIX Admin API 密钥 (务必修改为实际值)
  KUBEAI_APISIX_ADMIN_KEY: "edd1c9f034335f136f87ad84b625c8f1"

  # APISIX forward-auth 回源地址 (K8s 集群内可达的后端)
  KUBEAI_BACKEND_INTERNAL_URL: "http://backend.kubeai.svc.cluster.local:8000"

  # -- 容器镜像 (生产环境必须使用内网可访问的地址，禁止用 Docker Hub/GCR 等外网源)
  # BusyBox initContainer: dev-env / inference 共用，做 hostPath chown
  BUSYBOX_IMAGE: "hub.uimpcloud.com/kubeai/busybox:1.36"
  # Kaniko: 训练任务镜像构建
  KANIKO_IMAGE: "hub.uimpcloud.com/kubeai/kaniko-executor:latest"
  # MinIO mc: 数据集导入等任务
  MINIO_MC_IMAGE: "hub.uimpcloud.com/kubeai/minio-mc:latest"

  # -- TensorBoard sidecar 镜像与端口 (由 build_vcjob 注入到 trainer Pod)
  # 训练任务创建时勾选 "TensorBoard 可视化" 即注入该 sidecar
  TENSORBOARD_IMAGE: "hub.uimpcloud.com/kubeai/kubeai-tensorboard:latest"
  TENSORBOARD_PORT: "6006"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: kubeai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # -- JWT 签名密钥 (部署时必须修改)
  SECRET_KEY: "change-me-to-a-random-32-char-string"

  # -- 数据库连接 (密码与 postgresql/postgresql.yaml 中一致)
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgresql.kubeai.svc.cluster.local:5432/kubeai"

  # -- Redis 连接
  REDIS_URL: "redis://redis.kubeai.svc.cluster.local:6379/0"

  # -- MinIO 凭证 (与 minio/minio.yaml 中 MINIO_ROOT_USER/PASSWORD 一致)
  MINIO_ENDPOINT: "minio.kubeai.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"

  # -- Harbor 镜像仓库 (部署 Harbor 后修改)
  HARBOR_URL: "http://harbor.kubeai.local"
  HARBOR_USERNAME: "admin"
  HARBOR_PASSWORD: "Harbor12345"

  # -- Label Studio API Token (部署 Label Studio 后配置)
  LABEL_STUDIO_API_TOKEN: ""

  # -- OIDC (启用 SSO 时配置)
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""

# Label Studio Secret - 数据库密码
# 密码需与 postgresql/postgresql-secret.yaml 中一致
---
apiVersion: v1
kind: Secret
metadata:
  name: labelstudio-secret
  namespace: kubeai
  labels:
    app.kubernetes.io/name: labelstudio
    app.kubernetes.io/component: annotation
type: Opaque
stringData:
  # -- PostgreSQL 连接密码 (需与 postgresql-secret 一致)
  postgres-password: "postgres"
  # -- JWT 签名密钥 (SECRET_KEY)，签发 PAT / 会话 cookie 用
  # 部署后不可更改，否则所有已签发 token 与登录会话全部失效；生产环境请替换为自有随机值
  secret-key: "b68550b5784372a7c00faa67831289a39e5bb19801a8d7566453fcc6ca00fefa"

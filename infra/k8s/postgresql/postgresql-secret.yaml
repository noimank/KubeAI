# PostgreSQL Secret - 数据库密码
# 部署前必须将 password 替换为随机安全密码
# 生成随机密码: openssl rand -base64 32
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: kubeai
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # -- 数据库密码 (部署时必须修改)
  password: "postgres"

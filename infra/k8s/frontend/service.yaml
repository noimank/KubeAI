# Frontend Service
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kubeai
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web

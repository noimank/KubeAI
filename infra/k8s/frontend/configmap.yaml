# KubeAI 前端配置 - ConfigMap
# 部署: kubectl apply -f infra/k8s/frontend/configmap.yaml
#
# 本 ConfigMap 注入为前端容器的环境变量。
# 容器启动时由 docker-entrypoint.sh 读取环境变量并覆写 /usr/share/nginx/html/config.js,
# 浏览器加载该文件后通过 window.__RUNTIME_CONFIG__ 读取配置。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: kubeai
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
data:
  # -- 顶部导航栏平台名称 / 浏览器标签页标题
  APP_TITLE: "KubeAI"

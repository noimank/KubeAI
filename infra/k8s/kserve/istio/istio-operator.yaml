# Istio 最小化部署配置 (IstioOperator CR)
# 该文件是 manifest 生成源，不直接 kubectl apply。
# 运行 generate.sh 将其转换为纯 K8s YAML (istio-manifest.yaml)。
#
# 镜像清单 (minimal profile):
#   docker.io/istio/pilot:1.24.3
#   docker.io/istio/proxyv2:1.24.3
#
# 离线环境: 运行 generate.sh 时指定 PRIVATE_REGISTRY 替换镜像仓库。
#
# ref: https://istio.io/latest/docs/setup/install/operator/
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: kserve-istio
  namespace: istio-system
spec:
  profile: minimal
  hub: docker.io/istio
  tag: 1.24.3

  meshConfig:
    accessLogFile: /dev/stdout
    outboundTrafficPolicy:
      mode: ALLOW_ANY

  components:
    pilot:
      k8s:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        namespace: istio-system
        k8s:
          service:
            type: NodePort
            ports:
              - name: http2
                port: 80
                targetPort: 8080
              - name: https
                port: 443
                targetPort: 8443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

    egressGateways: []
    cni:
      enabled: false

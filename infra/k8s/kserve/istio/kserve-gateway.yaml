# KServe Istio Gateway + IngressClass
# Istio 安装完成后部署，为 KServe 推理服务创建入站路由资源。
#
# 部署: kubectl apply -f infra/k8s/kserve/istio/kserve-gateway.yaml
#
# 前提:
#   1. Istio 已就绪: kubectl get pods -n istio-system -l istio=ingressgateway
#   2. kserve 命名空间已创建: kubectl get ns kserve
---
# IngressClass — 将 Istio ingress controller 注册为 K8s 标准 Ingress 实现
# KServe Standard 模式据此为推理服务自动创建 Ingress 资源
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: istio
spec:
  controller: istio.io/ingress-controller
---
# Gateway — KServe 推理流量入口
# 对应 kserve.yaml inferenceservice-config 中的:
#   "kserveIngressGateway": "kserve/kserve-ingress-gateway"
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: kserve-ingress-gateway
  namespace: kserve
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"

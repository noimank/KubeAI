# MinIO - 对象存储 (模型文件)
# 部署: kubectl apply -k infra/k8s/minio/
# 端口: API ClusterIP 9000 | Console ClusterIP 9001
#
# 生产部署前:
#   1. 替换 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD（使用 Secret）
#   2. 确认 StorageClass 可用: kubectl get storageclass
#   3. 按需调整 PVC 大小
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: kubeai
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  root-user: "minioadmin"       # 生产环境必须替换
  root-password: "minioadmin"   # 生产环境必须替换
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: kubeai
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: storage
    spec:
      nodeSelector:
        kubeai: "true"
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-03-12T18-04-18Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: kubeai
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  namespace: kubeai
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi

# MLflow Secret - 数据库连接字符串
# 密码需与 postgresql/postgresql-secret.yaml 中一致
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secret
  namespace: kubeai
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: tracking
type: Opaque
stringData:
  # -- MLflow 后端数据库 URI (密码需与 postgresql-secret 一致)
  backend-store-uri: "postgresql://postgres:postgres@postgresql.kubeai.svc.cluster.local:5432/mlflow"

# MLflow Tracking Server - 实验追踪
# 依赖: PostgreSQL (需 mlflow 数据库)
# 部署: kubectl apply -f infra/k8s/mlflow/mlflow.yaml
# 端口: ClusterIP 5000 (内部访问；如需外部，通过 Ingress 暴露)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: kubeai
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/component: tracking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/component: tracking
    spec:
      nodeSelector:
        kubeai: "true"
      containers:
        - name: mlflow
          image: hub.uimpcloud.com/kubeai/mlflow:v3.12.0
          command: ["mlflow", "server"]
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --backend-store-uri
            - "$(MLFLOW_BACKEND_STORE_URI)"
            - --default-artifact-root
            - /mlflow/artifacts
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: backend-store-uri
            - name: MLFLOW_SQLALCHEMYSTORE_POOL_SIZE
              value: "10"
            - name: MLFLOW_SQLALCHEMYSTORE_MAX_OVERFLOW
              value: "20"
            - name: MLFLOW_SQLALCHEMYSTORE_POOL_RECYCLE
              value: "3600"
            # MLflow 3.5+ 默认仅放行 localhost / 私网 IP，训练 Pod 经集群内服务名
            # (mlflow.kubeai.svc.cluster.local) 访问会被 403 "Invalid Host header" 拒绝。
            # 此服务为 ClusterIP 内部访问，故放开全部 Host (DNS 重绑定防护对内网无意义)。
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            # MLflow 3.12+ 新增 CORSBlockingMiddleware，前端浏览器请求带 Origin header
            # (如 http://mlflow.uimpcloud.com) 被判定为跨域请求 → 403。放开全部来源。
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "*"
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: artifacts
              mountPath: /mlflow/artifacts
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: artifacts
          hostPath:
            path: /data/kubeai/mlflow/
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: kubeai
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: tracking
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: http
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: tracking

[project]
name = "kubeai-backend"
version = "0.1.0"
description = "KubeAI Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.44.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.49,<2.1.0",
    "asyncpg>=0.31.0,<1.0.0",
    "alembic>=1.18.4,<2.0.0",
    "pydantic[email]>=2.13.3,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "redis>=7.4.0,<8.0.0",
    "structlog>=25.5.0,<26.0.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.0.0",
    "casbin>=1.43.0",
    "casbin-sqlalchemy-adapter>=1.4.0",
    "psycopg2-binary>=2.9.12",
    "kubernetes>=35.0.0",
    "authlib>=1.7.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "python-multipart>=0.0.27",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pre-commit",
    "types-requests>=2.33.0.20260503",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

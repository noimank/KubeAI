[project]
name = "pytorch-mnist"
version = "1.0.0"
description = "PyTorch MNIST CNN 全流程示例 — 训练、MLflow 实验追踪、模型导出、推理服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "mlflow>=2.8.0",
    "flask>=3.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0,<1.20.0",
]

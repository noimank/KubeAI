# KubeAI Pre-commit Hooks
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ============================================================
  # Backend - Python
  # ============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ============================================================
  # Local project checks
  # ============================================================
  - repo: local
    hooks:
      - id: backend-mypy
        name: "backend: mypy"
        entry: uv --directory backend run mypy app/
        language: system
        pass_filenames: false
        files: ^backend/(app|tests|mypy\.ini|pyproject\.toml|uv\.lock)
        exclude: ^backend/alembic/

      - id: frontend-eslint
        name: "frontend: eslint"
        entry: pnpm -C frontend exec eslint . --fix
        language: system
        require_serial: true
        pass_filenames: false
        types_or: [ts, tsx]
        files: ^frontend/
        exclude: ^(frontend/node_modules|frontend/dist)/

      - id: frontend-prettier
        name: "frontend: prettier"
        entry: pnpm -C frontend exec prettier --write --ignore-unknown .
        language: system
        require_serial: true
        pass_filenames: false
        types_or: [ts, tsx, css, json, markdown]
        files: ^frontend/
        exclude: ^(frontend/node_modules|frontend/dist)/

      - id: frontend-typecheck
        name: "frontend: typecheck"
        entry: pnpm -C frontend exec tsc --noEmit
        language: system
        types_or: [ts, tsx]
        files: ^frontend/
        exclude: ^(frontend/node_modules|frontend/dist)/
        pass_filenames: false
